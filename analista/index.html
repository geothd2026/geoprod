<!DOCTYPE html>
<html lang="pt-BR" data-skin="tatico" data-perfil="analista">
<head>
<meta charset="utf-8">

<style>
/* Layout: coluna única de trabalho (máx. 860px) sob barra preta-oliva; cores de carta topográfica
   por função: verde-oliva = ação, azul = hidrografia/ligações, sépia = relevo/conceitos, verde = vegetação/conforme. */
:root{
  --bg:#e8eae0; --surface:#fbfbf6; --sunken:#f0f1e8; --ink:#14170f; --muted:#565b4a; --line:#c8ccba;
  --bar:#1b1f10; --bar-ink:#eceedd; --bar-muted:#aab08f;
  --accent:#4b5320; --accent-ink:#ffffff; --accent-soft:#e0e4cc;
  --hidro:#1c6a96; --veg:#4f7f3f; --veg-soft:#e2edd9; --relevo:#8a5a2b; --relevo-soft:#f3e8d7;
  --warn:#8a5200; --warn-soft:#fbefd4; --crit:#a3271f; --crit-soft:#f8e1dd;
  --trim:#aeb968;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10120c; --surface:#1a1d13; --sunken:#14170f; --ink:#e8eadd; --muted:#a2a78f; --line:#30351f;
    --bar:#0b0d07; --bar-ink:#eceedd; --bar-muted:#9aa07f;
    --accent:#aeb968; --accent-ink:#151908; --accent-soft:#2a2f16;
    --hidro:#74b6db; --veg:#93c27f; --veg-soft:#1b2a16; --relevo:#d3a16b; --relevo-soft:#2c2315;
    --warn:#e3ad52; --warn-soft:#30260f; --crit:#f08e84; --crit-soft:#351a17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10120c; --surface:#1a1d13; --sunken:#14170f; --ink:#e8eadd; --muted:#a2a78f; --line:#30351f;
  --bar:#0b0d07; --bar-ink:#eceedd; --bar-muted:#9aa07f;
  --accent:#aeb968; --accent-ink:#151908; --accent-soft:#2a2f16;
  --hidro:#74b6db; --veg:#93c27f; --veg-soft:#1b2a16; --relevo:#d3a16b; --relevo-soft:#2c2315;
  --warn:#e3ad52; --warn-soft:#30260f; --crit:#f08e84; --crit-soft:#351a17;
  color-scheme:dark;
}
:root[data-skin="marinho"]{--bg:#e9eef3;--surface:#fbfcfe;--sunken:#eef2f6;--ink:#0f1b2d;--muted:#4d5b6e;--line:#c5cfdb;--bar:#0c2340;--bar-ink:#f2f5f9;--bar-muted:#9fb2c8;--accent:#12406e;--accent-ink:#ffffff;--accent-soft:#dbe6f2;--hidro:#1c6a96;--veg:#3f7a4a;--veg-soft:#e0eee2;--relevo:#8a6400;--relevo-soft:#fbf1d0;--trim:#e3b324;}
@media (prefers-color-scheme: dark){:root[data-skin="marinho"]:not([data-theme="light"]){--bg:#0a1422;--surface:#111e31;--sunken:#0d1828;--ink:#e6ecf4;--muted:#97a6ba;--line:#24344b;--bar:#060d18;--bar-ink:#f2f5f9;--bar-muted:#8fa2b9;--accent:#f0c23a;--accent-ink:#1a1400;--accent-soft:#2b2a17;--hidro:#6fb4e6;--veg:#84c892;--veg-soft:#14281b;--relevo:#f0c23a;--relevo-soft:#2a2410;--trim:#f0c23a;}}
:root[data-skin="marinho"][data-theme="dark"]{--bg:#0a1422;--surface:#111e31;--sunken:#0d1828;--ink:#e6ecf4;--muted:#97a6ba;--line:#24344b;--bar:#060d18;--bar-ink:#f2f5f9;--bar-muted:#8fa2b9;--accent:#f0c23a;--accent-ink:#1a1400;--accent-soft:#2b2a17;--hidro:#6fb4e6;--veg:#84c892;--veg-soft:#14281b;--relevo:#f0c23a;--relevo-soft:#2a2410;--trim:#f0c23a;}
:root[data-skin="tatico"]{--bg:#e6ecea;--surface:#f9fbfa;--sunken:#edf2f0;--ink:#0f1c1a;--muted:#4c5e5a;--line:#c2d0cc;--bar:#0e2622;--bar-ink:#e8f3f0;--bar-muted:#94b3ac;--accent:#0b6b63;--accent-ink:#ffffff;--accent-soft:#d6ebe7;--hidro:#0f6a8c;--veg:#3f7a4a;--veg-soft:#deeee0;--relevo:#8a5a2b;--relevo-soft:#f3e8d7;--trim:#1fb5a6;}
@media (prefers-color-scheme: dark){:root[data-skin="tatico"]:not([data-theme="light"]){--bg:#081110;--surface:#0f1b19;--sunken:#0b1514;--ink:#e2efec;--muted:#8fa8a2;--line:#1f332f;--bar:#040a09;--bar-ink:#e2efec;--bar-muted:#7f9a94;--accent:#3fd0c0;--accent-ink:#04201c;--accent-soft:#12302c;--hidro:#6cc4e8;--veg:#86cf96;--veg-soft:#12281a;--relevo:#dba36a;--relevo-soft:#2a2115;--trim:#3fd0c0;}}
:root[data-skin="tatico"][data-theme="dark"]{--bg:#081110;--surface:#0f1b19;--sunken:#0b1514;--ink:#e2efec;--muted:#8fa8a2;--line:#1f332f;--bar:#040a09;--bar-ink:#e2efec;--bar-muted:#7f9a94;--accent:#3fd0c0;--accent-ink:#04201c;--accent-soft:#12302c;--hidro:#6cc4e8;--veg:#86cf96;--veg-soft:#12281a;--relevo:#dba36a;--relevo-soft:#2a2115;--trim:#3fd0c0;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.85rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--hidro)}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--trim)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.05rem;margin-right:auto;letter-spacing:.02em;text-transform:uppercase}
.emb{width:42px;height:42px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.emb .n{stroke-width:1.1;opacity:.75}
.emb .f{fill:currentColor;stroke:none}
.emb .t{fill:var(--trim);stroke:none}
.emb.big{width:136px;height:136px;color:var(--ink)}
.embw{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 .78rem var(--mono);letter-spacing:.22em;color:var(--muted)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.hero>.stack{flex:1 1 320px}
.hero>.stack{text-align:center;align-items:center}
.top-in{flex-direction:column;align-items:center;gap:8px}
.top-in .brand{margin-right:0;justify-content:center;flex-wrap:wrap;text-align:center}
.top-in nav{justify-content:center}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--bar-muted);font-weight:500;font-size:.92rem}
nav a[aria-current="page"]{background:var(--bar-ink);color:var(--bar)}
.notice{background:var(--sunken);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.notice div{max-width:860px;margin:0 auto;padding:6px 16px;text-align:justify;hyphens:none;-webkit-hyphens:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#bg{display:none}
#bgimg{position:fixed;inset:0;z-index:0;pointer-events:none;background:url(../img/fundo-claro.jpg) right bottom/cover no-repeat;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #bgimg{background-image:url(../img/fundo-escuro.jpg);mix-blend-mode:screen}}
:root[data-theme="dark"] #bgimg{background-image:url(../img/fundo-escuro.jpg);mix-blend-mode:screen}
.notice,main{position:relative;z-index:1}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:20px}
.lead{color:var(--muted);text-align:justify;hyphens:none;-webkit-hyphens:none}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
#carta{display:block;width:100%;height:210px;border:1px solid var(--ink);border-radius:2px;background:#cfd6b8}
figcaption{font-size:.8rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.mode:hover{border-color:var(--accent)}
.mode span{color:var(--muted);font-size:.93rem;text-align:justify;hyphens:none;-webkit-hyphens:none}
.flow{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);align-items:center;justify-content:space-between}
@media (max-width:760px){.flow{justify-content:center}}
.flow b{color:var(--ink);font-weight:500;background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:4px;flex:1 1 auto;text-align:center}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:.93rem}
label.f small,.hint{font-weight:400;color:var(--muted);font-size:.84rem}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
textarea.code{font:400 .8rem/1.45 var(--mono);min-height:170px}
:focus-visible{outline:2px solid var(--hidro);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:500;font-size:.93rem;padding:0;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--sunken);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt span{display:flex;flex-direction:column}
.opt small{color:var(--muted);font-size:.83rem}
.opt img,.opt canvas.thumb{width:112px;height:84px;object-fit:cover;border:1px solid var(--ink);border-radius:2px;flex:none;background:var(--sunken)}
.pill>span,.just{text-align:justify;hyphens:none;-webkit-hyphens:none}
.hero,main>.card:not(.layer){position:relative;border-radius:0}
.hero{border:1px solid var(--line);padding:26px 24px}
.hero .lead{max-width:65ch;text-align-last:center}
.hero::before,.hero::after,main>.card:not(.layer)::before,main>.card:not(.layer)::after{content:"";position:absolute;width:24px;height:24px;border:3px solid var(--trim);pointer-events:none}
.hero::before,main>.card:not(.layer)::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.hero::after,main>.card:not(.layer)::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.ver{font:500 .66rem var(--mono);letter-spacing:.08em;border:1px solid var(--trim);color:var(--trim);padding:2px 6px;border-radius:3px;white-space:nowrap}
[data-perfil="solicitante"] .ver::after{content:" · Solicitante"}
[data-perfil="analista"] .ver::after{content:" · Analista"}
[data-perfil="solicitante"] nav a[href="#analista"]{display:none}
.pfs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pf{flex:1 1 220px;max-width:420px;align-items:center;gap:4px;text-align:center}
.pf img,.pf canvas{display:block;width:100%;height:auto;border:1px solid var(--ink);border-radius:2px}
.pf small{color:var(--muted);font-size:.78rem}
details summary{cursor:pointer;font-weight:500;font-size:.9rem;color:var(--hidro)}
details textarea{margin-top:8px}
.medidas{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.medidas dl{flex:1 1 200px;font:400 .86rem var(--mono)}
.mxq{display:grid;grid-template-columns:64px 1fr 1fr;gap:4px;font-size:.84rem;max-width:620px}
.mxq div{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);background:var(--sunken);border-radius:3px}
.mxq div b{font:600 1.15rem var(--mono)}
.mxq div strong{font-weight:600}
.mxq div.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mxq span{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.78rem;padding:4px}
.papel{width:100%;max-width:300px;height:auto;color:var(--ink)}
.papel rect{fill:var(--sunken);stroke:currentColor;stroke-width:1}
.papel rect.on{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.papel rect.frame{fill:none}
.papel rect.frame.on{fill:none;stroke-width:4}
.papel text{font:500 11px var(--mono);fill:currentColor}
.opts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.tag{font:500 .72rem var(--mono);padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-left:auto;font-style:normal;white-space:nowrap}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btns.fill button{flex:1 1 auto}
button{font:500 .95rem var(--body);border-radius:4px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.sm{padding:5px 10px;font-size:.85rem}
button:disabled{opacity:.5;cursor:default}
.save{display:none}
body.can-save .save{display:inline-block}
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:.8rem}
.steps li{flex:1 1 auto;text-align:center;padding:4px 9px;border-radius:3px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.steps li.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps li.done{color:var(--accent);border-color:var(--accent)}
.pill{background:var(--relevo-soft);border-left:4px solid var(--relevo);padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.pill b{font-family:var(--display);color:var(--relevo);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.alert{padding:10px 12px;font-size:.92rem;border-left:4px solid var(--warn);background:var(--warn-soft);text-align:justify;hyphens:none;-webkit-hyphens:none}
.alert.crit{border-color:var(--crit);background:var(--crit-soft)}
.alert.ok{border-color:var(--veg);background:var(--veg-soft)}
dl.kv{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:6px 14px;margin:0;font-size:.93rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.layer{border-left:5px solid var(--hidro)}
.layer.l2{border-left-color:var(--relevo)}
.layer.l3{border-left-color:var(--veg)}
.layer>h2 small{font:500 .72rem var(--mono);color:var(--muted);display:block;margin-bottom:4px;letter-spacing:.04em}
.prio{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.prio i{font:600 1rem var(--mono);font-style:normal;width:30px;height:30px;border-radius:3px;display:grid;place-items:center;background:var(--ink);color:var(--surface)}
ol.rot{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:r}
ol.rot li{counter-increment:r}
ol.rot .opt span b::before{content:counter(r) ". ";font-family:var(--mono);color:var(--muted);font-weight:500}
.sc{display:grid;grid-template-columns:130px 1fr 120px;gap:8px;align-items:center;font-size:.92rem}
.lib{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.lib:first-of-type{border-top:0}
.lib code{font:500 .8rem var(--mono);color:var(--muted)}
.muted{color:var(--muted);font-size:.9rem}
@media (max-width:480px){h1{font-size:1.5rem}#carta{height:160px}.sc{grid-template-columns:1fr 1fr}.sc>span{grid-column:1/-1;font-weight:500}dl.kv{grid-template-columns:1fr}dl.kv dt{margin-top:6px}}
@media (prefers-reduced-motion:no-preference){.opt,.mode,button{transition:border-color .15s,background-color .15s}}
@media (max-width:620px){
 nav{flex-wrap:nowrap;max-width:100%;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 nav::-webkit-scrollbar{display:none}
 nav a{padding:5px 6px;font-size:.76rem;white-space:nowrap}
}
@media (max-width:380px){nav a{padding:5px 4px;font-size:.72rem}}

</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="bgimg" aria-hidden="true"></div>
<header class="top"><div class="top-in">
  <div class="brand"><img class="emb" src="../img/emblema.png" alt="">Demanda de Geointeligência<span class="ver">TESTES 0.9</span></div>
  <nav aria-label="Seções">
    <a href="#inicio">Início</a><a href="#solicitante">Solicitante</a><a href="#avaliacao">Avaliação</a><a href="#analista">Analista</a><a href="#biblioteca">Biblioteca</a>
  </nav>
</div></header>
<div class="notice"><div>Protótipo de trabalho individual. Não constitui sistema oficial. Nada do que for digitado é transmitido ou armazenado: a demanda existe apenas nesta tela e no arquivo gerado. Empregar somente dados ostensivos.</div></div>
<main id="app"></main>

<script>
/* ---------- utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const ks=p.split('.'),l=ks.pop();ks.reduce((a,k)=>a[k]??(a[k]={}),o)[l]=v;};
const iso=d=>d.toISOString().slice(0,10);
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
const daysTo=s=>{if(!s)return null;const a=new Date(s+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5);};
const NI='não informado';
const brDate=s=>s?s.split('-').reverse().join('/'):NI;

/* ---------- dicionários ---------- */
const USUARIO={decisor:'Comandante, chefe ou diretor (decisor)',em:'Estado-maior ou seção',tropa:'Tropa no terreno',analista:'Outro analista ou agência de Inteligência'};
const USO={apres:'Apresentação ou briefing',plan:'Planejamento',campo:'Emprego no terreno',tela:'Consulta em tela',anexo:'Anexo a documento'};
const CONSEQ={decisao:['Decisão ou operação fica sem apoio de Inteligência','alta'],atraso:['O planejamento sofre atraso','alta'],incompleto:['O trabalho fica menos completo, sem prejuízo direto','baixa'],nenhuma:['Sem consequência imediata','baixa']};
const ONDE={local:'Município ou localidade',ar:'Área de responsabilidade de OM',ponto:'Ponto e raio',eixo:'Itinerário entre dois pontos',kml:'Arquivo KML, remetido em anexo à demanda',coord:'Coordenadas'};
const EXT={inst:['Instalação ou quarteirão','1:1.000 a 1:10.000'],cidade:['Bairro ou cidade','1:25.000 a 1:100.000'],regiao:['Vários municípios','1:250.000 a 1:1.000.000'],estado:['Estado ou área maior','1:1.000.000 ou menor']};
const RAMOS={
 A:{q:'Conhecer uma área e o que nela existe',p:'Mapa temático',pronto:1},
 B:{q:'Saber o que existe ou o que ocorre em um local',p:'Análise de imagens',pronto:1},
 C:{q:'Saber o que mudou em um local',p:'Análise de mudanças no tempo',pronto:1},

function deduce(r){
 const ramo=r.ramo||'N',ref=cfg[ramo]??14,dias=daysTo(r.dataDesejada);
 const urg=dias==null?null:(dias<ref?'alta':'baixa'),imp=CONSEQ[r.conseq]?.[1]||null;
 let prio=null;
 if(urg&&imp)prio=imp==='alta'?(urg==='alta'?1:2):(urg==='alta'?3:4);
 const al=[],pe=[];
 if(dias!=null&&dias<0)al.push(['crit','A data desejada já foi ultrapassada.']);
 else if(urg==='alta')al.push(['warn',`A data desejada (em ${dias} dias) é inferior ao prazo de referência da seção para este produto (${ref} dias).`]);
 if(r.dataDesejada&&r.dataLimite&&r.dataLimite<r.dataDesejada)al.push(['crit','A data-limite de utilidade é anterior à data desejada.']);
 let resol=null,fonte=null;
 if(ramo==='B'){
  resol=B_DET[r.B.detalhe]?.[1]||null;
  if(r.B.recencia)fonte=(r.B.recencia==='mes'||r.B.recencia==='evento')?'Provável nova obtenção de imagem':'Acervo existente';
  if(r.B.detalhe==='pess'){fonte='Obtenção por SARP (drone) ou aeronave; GSD de 1 a 5 cm';al.push(['warn',`Resolução ultra-alta não é obtida por satélite: exige voo de SARP (drone) ou aeronave sobre o local, com autorização e prazo adicional de no mínimo ${cfg.sarp} dias.`]);}
  if((r.B.detalhe==='veic'||r.B.detalhe==='edif'||r.B.detalhe==='pess')&&(r.extensao==='regiao'||r.extensao==='estado'))al.push(['warn','O detalhamento solicitado é incompatível com a extensão da área. Reduzir a área ou aceitar menor detalhamento.']);
  if(r.B.detalhe==='veic'&&(r.B.recencia==='mes'||r.B.recencia==='evento'))al.push(['warn',`Imagem atual de altíssima resolução depende de nova obtenção, com prazo de no mínimo ${cfg.obt} dias.`]);
  if(!r.B.local)pe.push('Tipo de local');if(!r.B.saber.length)pe.push('O que se necessita saber sobre o local');
  if(!r.B.recencia)pe.push('Resolução temporal exigida da imagem');if(!r.B.detalhe)pe.push('Nível de detalhamento');
 }
 if(ramo==='F'){
  if(r.F.origem==='nao')al.push(['warn','Sem origem conhecida, a análise terá limitações, que deverão constar do produto.']);
  if(r.F.saber.includes('pessoas'))al.push(['warn','A descrição de pessoas depende da resolução do material recebido: imagem orbital não alcança esse nível de detalhe. Pela regra prática da fotogrametria, o alvo deve medir de 3 a 5 vezes o GSD para ser identificado. Avaliar a necessidade de obtenção por voo de SARP (drone) sobre o local.']);
  if(r.F.material.includes('rede'))al.push(['warn','Material de rede social costuma chegar sem metadados. Havendo o arquivo original, remetê-lo.']);
  if(!r.F.material.length)pe.push('Tipo de material');if(!r.F.origem)pe.push('Origem do material');if(!r.F.saber.length)pe.push('O que se necessita saber sobre o material');
 }
 if(ramo==='A'){
  if(r.A.dados&&r.A.dados!=='nao')al.push(['warn','Os dados próprios devem ser remetidos em anexo à demanda.']);
  if(r.A.temas.length>7)al.push(['warn','Muitos temas em um único mapa prejudicam a clareza. Avaliar a divisão em mais de um produto.']);
  if(!r.A.fim)pe.push('Finalidade do mapa');if(!r.A.temas.length)pe.push('Temas a representar');if(!r.A.fundo)pe.push('Fundo do mapa');
 }
 if(ramo==='C'){
  resol=B_DET[r.C.detalhe]?.[1]||null;
  if(r.C.detalhe==='pess'){fonte='Obtenção por SARP (drone) ou aeronave; GSD de 1 a 5 cm';al.push(['warn',`Resolução ultra-alta não é obtida por satélite: exige voo de SARP (drone) ou aeronave sobre o local, com autorização e prazo adicional de no mínimo ${cfg.sarp} dias.`]);}
  if(r.C.de&&r.C.ate&&r.C.ate<r.C.de)al.push(['crit','A data final do período é anterior à data inicial.']);
  if(r.C.modo==='period')al.push(['warn','O acompanhamento periódico compromete meios da seção por prazo prolongado. A frequência será confirmada no parecer.']);
  if(!r.C.tipos.length)pe.push('Tipo de mudança');if(!r.C.de)pe.push('Data inicial do período');if(!r.C.modo)pe.push('Comparação única ou acompanhamento');
  if(r.C.modo==='period'&&!r.C.freq)pe.push('Frequência do acompanhamento');if(!r.C.detalhe)pe.push('Nível de detalhamento');
 }
 if(ramo==='D'){
  if(r.D.dados==='end'||r.D.dados==='rel')al.push(['warn','Os registros precisam ser localizados antes da análise, o que amplia o prazo.']);
  if(r.D.dados==='nao')al.push(['warn','Sem dados não há análise. A obtenção dos registros passa a integrar o prazo.']);
  if(r.D.dados==='coord'||r.D.dados==='end')al.push(['warn','A planilha deve ser remetida em anexo à demanda.']);
  if(!r.D.fen)pe.push('Fenômeno a analisar');if(r.D.fen==='outro'&&!r.D.fenOutro)pe.push('Descrição do fenômeno');if(!r.D.ver.length)pe.push('O que se deseja visualizar');if(!r.D.dados)pe.push('Disponibilidade de dados');
 }
 if(ramo==='E'){
  if(r.E.fins.includes('obs')&&!r.E.pontos)pe.push('Ponto de observação');
  if(!r.E.fins.length)pe.push('Finalidade do estudo do terreno');if(!r.E.meio)pe.push('Natureza da tropa ou do meio');if(!r.E.epoca)pe.push('Época do ano');
 }
 if(ramo!=='N'&&!RAMOS[ramo].pronto)al.push(['warn','Este ramo ainda não dispõe de perguntas próprias no protótipo. O analista completará a demanda mediante contato.']);
 if((ramo==='N'||!RAMOS[ramo].pronto)&&!r.livre)pe.push('Descrição da necessidade');
 [['nome','Identificação do solicitante'],['om','Organização Militar'],['contato','Contato'],['decisao','O que se necessita decidir, planejar ou acompanhar'],['pergunta','Pergunta que o produto deve responder'],
  ['dataDesejada','Data desejada'],['dataLimite','Data-limite de utilidade'],['conseq','Consequência do não atendimento no prazo'],['onde','Local'],['extensao','Extensão aproximada da área'],['formato','Formato de entrega']]
  .forEach(([k,l])=>{if(!r[k])pe.push(l);});
 if(!r.ramo)pe.push('Tipo de necessidade');
 if(r.formato==='impresso'&&!r.tamanho)pe.push('Tamanho da impressão');
 if(r.formato==='impresso'&&+r.vias>2&&!r.justif)pe.push('Justificativa para mais de duas vias');
 return {ramo,produto:RAMOS[ramo].p,ref,dias,urg,imp,prio,escala:EXT[r.extensao]?.[1]||null,resol,fonte,
  saida:r.formato?FORMATO[r.formato][1]+(r.formato==='impresso'&&r.tamanho?', '+TAM[r.tamanho][1]:''):null,al,pe};
}

/* ---------- ilustrações sintéticas ---------- */
const rnd=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);};
const sm=t=>t*t*(3-2*t);
const n2=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi),a=rnd(xi,yi),b=rnd(xi+1,yi),d=rnd(xi,yi+1),e=rnd(xi+1,yi+1);return a+(b-a)*xf+(d-a)*yf+(a-b-d+e)*xf*yf;};
const ST=[[.34,[154,192,140]],[.44,[196,210,154]],[.54,[226,212,156]],[.64,[206,164,110]],[.76,[160,112,78]],[.95,[238,232,222]]];
const ramp=v=>{if(v<=ST[0][0])return ST[0][1];for(let i=1;i<ST.length;i++)if(v<=ST[i][0]){const t=(v-ST[i-1][0])/(ST[i][0]-ST[i-1][0]),A=ST[i-1][1],B=ST[i][1];return [A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t];}return ST[ST.length-1][1];};
/* modo: hipso (carta), shade (relevo sombreado), veg (cor natural), pan (pancromática) */
function paint(g,W,H,modo,span,ox,oy){
 const im=g.createImageData(W,H),px=im.data,h=new Float32Array(W*H),k=span/W,CI=.03;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0,a=.5,f=1;for(let i=0;i<5;i++){v+=a*n2((x*k+ox)*f,(y*k+oy)*f);a*=.5;f*=2;}h[y*W+x]=v;}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x,v=h[i],xr=h[y*W+Math.min(W-1,x+1)],yd=h[Math.min(H-1,y+1)*W+x],xl=h[y*W+Math.max(0,x-1)],yu=h[Math.max(0,y-1)*W+x];
  const s=Math.max(.62,Math.min(1.22,1+((xl-xr)+(yu-yd))*W*.055));let col;
  if(modo==='shade'){const c=205*s;col=[c,c,c*.98];}
  else if(modo==='veg'){const t=n2(x*.35+ox,y*.35+oy)*.25;col=[(58+v*60+t*40)*s,(96+v*50+t*30)*s,(52+v*30)*s];}
  else if(modo==='pan'){const c=(70+v*110+n2(x*.5,y*.5)*40)*s;col=[c,c,c];}
  else{const agua=v<.33;
   if(agua)col=[150,190,216];
   else{col=ramp(v);col=[col[0]*s,col[1]*s,col[2]*s];const q=Math.floor(v/CI);if(q!==Math.floor(xr/CI)||q!==Math.floor(yd/CI)){const m=Math.max(q,Math.floor(xr/CI),Math.floor(yd/CI))%5===0?.75:.38;col=[col[0]+(96-col[0])*m,col[1]+(60-col[1])*m,col[2]+(30-col[2])*m];}}
   if(agua!==(xr<.33)||agua!==(yd<.33))col=[40,104,150];}
  px[i*4]=col[0];px[i*4+1]=col[1];px[i*4+2]=col[2];px[i*4+3]=255;
 }
 g.putImageData(im,0,0);
}
function drawCarta(){
 const c=document.getElementById('carta');if(!c||!c.getContext)return;

 if(s===4)body=`${pill('geoint')}${rd('req.ramo','Do que o Sr necessita, principalmente?',Object.entries(RAMOS).map(([k,v])=>[k,v.q,v.p,k==='N'||v.pronto?'':'em elaboração']))}`;
 if(s===5){

   ${rd('req.A.fundo','Qual o fundo desejado?',ent(A_FUNDO),'opts2')}${rd('req.A.dados','O Sr dispõe de dados próprios a incluir?',ent(DADOS_P),'opts2')}

   ${pill('resolucao')}${pill('sarp')}${rd('req.B.detalhe','Nível de detalhamento: o que a imagem deve permitir distinguir?',ent(B_DET,v=>v[0]))}
   ${pill('revisita')}${rd('req.B.recencia','Qual a resolução temporal exigida da imagem?',ent(B_REC),'opts2')}${pill('radar')}${pill('termal')}${pill('danos')}${comp}`;
  else if(r.ramo==='C')body=`${pill('realce')}${ck('req.C.tipos','Que tipo de mudança interessa?',C_TIPO)}
   <div class="row">${dt('req.C.de','Data inicial do período')}${dt('req.C.ate','Data final do período','Em branco: até a data atual.')}</div>
   ${rd('req.C.modo','Comparação única ou acompanhamento?',ent(C_MODO),'opts2')}${r.C.modo==='period'?rd('req.C.freq','Com que frequência?',ent(C_FREQ),'opts2'):''}
   ${pill('resolucao')}${rd('req.C.detalhe','Nível de detalhamento: o que a imagem deve permitir distinguir?',ent(B_DET,v=>v[0]))}${comp}`;
  else if(r.ramo==='D')body=`${pill('abertos')}${pill('dados')}${rd('req.D.fen','Qual fenômeno deve ser analisado?',ent(D_FEN),'opts2')}${r.D.fen==='outro'?tx('req.D.fenOutro','Descrever o fenômeno'):''}
   ${pill('hex')}${ck('req.D.ver','O que o Sr deseja visualizar?',D_VER)}${rd('req.D.dados','De que dados o Sr dispõe?',ent(D_DADOS))}
   ${rd('req.D.qtd','Quantidade aproximada de registros',ent(D_QTD),'opts2')}${tx('req.D.periodo','Período abrangido pelos dados','','Ex.: janeiro a junho de 2026.')}${comp}`;
  else if(r.ramo==='E')body=`${pill('mde')}${pill('pitcic')}${ck('req.E.fins','O que o estudo deve esclarecer?',E_FIM)}${rd('req.E.meio','Qual a natureza da tropa ou do meio considerado?',ent(E_MEIO),'opts2')}
   ${tx('req.E.pontos','Pontos de referência','Ponto de observação, origem e destino do itinerário ou objetivo, conforme o caso.')}${rd('req.E.epoca','Para que época do ano?',ent(E_EPOCA),'opts2')}${comp}`;
  else if(r.ramo==='F')body=`${pill('metadados')}${ck('req.F.material','De que material o Sr dispõe?',F_MAT)}${tx('req.F.qtd','Quantidade aproximada de arquivos')}
   ${rd('req.F.origem','O que se conhece sobre a origem do material?',ent(F_ORIG),'opts2')}${ck('req.F.saber','O que o Sr necessita saber?',F_SABER)}

  else if(r.ramo==='N')body=`<div class="alert">O analista fará contato para completar a demanda. As três respostas abaixo abreviam esse contato.</div>

 }
 if(s===6)body=`${pill('formatos')}${rd('req.formato','Em que formato o Sr necessita receber o produto?',ent(FORMATO,v=>[v[0],v[1]]),'opts2')}
  ${r.formato==='impresso'?rd('req.tamanho','Onde a impressão será empregada?',ent(TAM,v=>[v[0],v[1]]),'opts2')+papel(r.tamanho)+sel('req.vias','Número de vias',['1','2','3','4','5','6'].map(n=>[n,n]))+(+r.vias>2?ta('req.justif','Justificar a necessidade de mais de duas vias'):''):''}

 if(s===7){

   :`<p class="hint">O arquivo reúne as respostas e recebe um código de conferência. ${d.pe.length?'Há pendências: o arquivo pode ser gerado assim mesmo, e o analista as receberá para sanar.':''}</p>

 }
 return `<div class="stack"><h1>Demanda de produto</h1>

function vAnalista(){
 const a=S.an;
 const carga=`<section class="card"><h2>Carregar demanda</h2>

  <button data-act="load-ex" style="margin-left:auto">Carregar exemplo fictício</button></div><span class="hint" id="msg" role="status"></span></section>`;
 if(!a)return `<div class="stack"><h1>Ficha de demanda</h1><p class="lead">Carregar o arquivo da demanda recebida por canal seguro. A ficha é montada em seguida.</p></div>${carga}`;
 const r=a.req,d=deduce(r),rot=ROT[d.ramo],pes=d.ramo==='F'&&r.F.saber.includes('pessoas');
 const done=rot?rot.filter((_,i)=>a.rot[i]).length:0;
 return `<div class="stack"><h1>Ficha de demanda</h1>${r.exemplo?'<p class="lead">Demanda carregada: <strong>exemplo fictício</strong>.</p>':''}${a.integ==='ok'?`<div class="alert ok">Arquivo conferido. Código ${esc(r._cod)}, gerado em ${esc(r._em)}.</div>`:a.integ==='alterado'?'<div class="alert crit">O conteúdo não confere com o código de conferência: o arquivo foi alterado após a geração. Confirmar com o solicitante.</div>':a.integ==='semcod'?'<div class="alert">Arquivo sem código de conferência. Não é possível verificar se foi alterado.</div>':''}
  <div class="btns"><button data-act="unload">Carregar outra demanda</button></div></div>
 <section class="card layer"><h2><small>CAMADA 1</small>A demanda como foi formulada</h2>${kv(linhasPedido(r))}</section>
 <section class="card layer l2"><h2><small>CAMADA 2</small>Tradução técnica</h2>${d.prio?`<span class="prio"><i>${d.prio}</i>${PRIO_TXT[d.prio]}</span>`:''}${kv(linhasTec(d))}
  <div class="stack"><h3>Alertas</h3>${alerts(d)}</div>
  <div class="stack"><h3>Pendências a sanar com o solicitante</h3>${d.pe.length?`<div class="alert crit">${d.pe.map(esc).join('; ')}.</div>`:'<div class="alert ok">Demanda completa.</div>'}</div></section>
 <section class="card layer l3"><h2><small>CAMADA 3</small>Roteiro: ${esc(d.produto)}</h2>
  ${rot?`<p class="hint">Orientação, não prescrição. ${done} de ${rot.length} etapas assinaladas.</p><ol class="rot">${rot.map(([t,x],i)=>`<li><label class="opt"><input type="checkbox" id="rot-${i}" data-bool="an.rot.${i}" ${a.rot[i]?'checked':''}><span><b>${t}</b><small>${x}</small></span></label></li>`).join('')}</ol>`
  :'<div class="alert">Roteiro a definir após contato com o solicitante.</div>'}
  ${pes?`<div class="stack"><h3>Descrição de pessoas (SCCIAP)</h3>
   ${a.pessoas.map((p,i)=>`<div class="card" style="background:var(--sunken)"><div class="btns"><strong>Pessoa ${i+1}</strong><button class="sm" data-act="del-p" data-i="${i}" style="margin-left:auto">Excluir</button></div>
    ${SCCIAP.map(([k,l])=>`<div class="sc"><span>${l}</span><input type="text" id="p${i}-${k}" data-path="an.pessoas.${i}.${k}" value="${esc(p[k])}" aria-label="${l}, pessoa ${i+1}">
     <select id="p${i}-${k}-c" data-path="an.pessoas.${i}.${k}C" aria-label="Estado da mente: ${l}">${['certeza','opinião','dúvida'].map(c=>`<option ${p[k+'C']===c?'selected':''}>${c}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}
   <div class="btns"><button data-act="add-p">Incluir pessoa</button></div></div>
   <div class="stack"><h3>Identificação de pessoa</h3><p class="hint">Etapa separada, somente quando autorizada. O aplicativo não compara rostos nem armazena imagens: apenas registra o procedimento.</p>
   <div class="row">${tx('an.ident.aut','Autoridade que autorizou')}${tx('an.ident.mat','Material de comparação')}</div>
   ${sel('an.ident.res','Resultado',[['','Não realizada'],['Compatível','Compatível'],['Inconclusivo','Inconclusivo'],['Incompatível','Incompatível']],0)}</div>`:''}</section>
 <section class="card"><h2>Parecer de viabilidade</h2>
  ${rd('an.parecer.res','A seção tem condições de atender?',[['Atende','Atende'],['Atende em parte','Atende em parte'],['Não atende','Não atende']],'opts2')}
  ${rd('an.parecer.sarp','Necessita obtenção de imagens por SARP (drone) sobre o local?',ent(SN2),'opts2')}
  ${a.parecer.sarp==='sim'?`<div class="alert">A obtenção por SARP acresce ao prazo do produto o prazo de referência da seção: ${cfg.sarp} dias. Registrar a necessidade de autorização para o voo e a fração encarregada.</div>`:''}
  <div class="row">${dt('an.parecer.prazo','Prazo estimado de entrega')}${tx('an.parecer.analista','Analista responsável')}</div>
  ${ta('an.parecer.falta','O que falta para iniciar ou para atender por completo')}${ta('an.parecer.obs','Observações ao solicitante')}
  <div class="btns"><button class="pri" data-act="parecer">Gerar parecer</button></div>
  ${a.texto?`<textarea class="code" id="out-par" readonly aria-label="Texto do parecer">${esc(a.texto)}</textarea><div class="btns"><button data-act="copy" data-src="out-par">Copiar parecer</button><button class="save" data-act="save" data-src="out-par" data-name="parecer-geoint.txt">Salvar parecer</button></div><span class="hint" id="msg2" role="status"></span>`:''}</section>
 <section class="card"><h2>Prazos de referência da seção</h2><p class="hint">Em dias. Ajustar conforme efetivo, meios e acesso a dados. Ficam registrados apenas neste navegador.</p>
  <div class="row">${Object.entries(RAMOS).filter(([k])=>k!=='N').map(([k,v])=>`<label class="f" for="cfg-${k}">${v.p}<input type="number" min="1" id="cfg-${k}" data-cfg="${k}" value="${cfg[k]}"></label>`).join('')}
  <label class="f" for="cfg-obt">Nova obtenção de imagem (mínimo)<input type="number" min="1" id="cfg-obt" data-cfg="obt" value="${cfg.obt}"></label>
  <label class="f" for="cfg-sarp">Obtenção por SARP (drone)<input type="number" min="1" id="cfg-sarp" data-cfg="sarp" value="${cfg.sarp}"></label></div>
  <div class="btns"><button data-act="cfg">Aplicar prazos</button></div></section>`;
}
function vBib(){
 const man=[['Manual de Campanha Geoinformação','EB20-MC-10.209, 1ª edição, 2014','Conceitos de Geoinformação e seu emprego na Força Terrestre.','https://bdex.eb.mil.br/jspui/bitstream/123456789/11917/1/EB20MC10209.pdf'],
  ['Manual de Campanha Processo de Integração Terreno, Condições Meteorológicas, Inimigo e Considerações Civis (PITCIC)','EB70-MC-10.336, 1ª edição, 2023','Aprovado pela Portaria COTER/C Ex nº 275, de 26 de maio de 2023. Disponível no Portal da Doutrina do Exército.',''],
  ['Manual Técnico Geointeligência','EB70-MT-70.402, 1ª edição, 2019','Em vigor. Será substituído pelo Manual de Campanha de Geointeligência.',''],
  ['Manual de Campanha de Geointeligência','Em edição','Será incluído após a publicação.','']];
 const ext=[['GEOINT Basic Doctrine, Publication 1.0','National System for Geospatial Intelligence (EUA), 2018','Doutrina básica de Geointeligência: definição, dados, processo e profissionais. Em inglês.','https://www.nga.mil/resources/GEOINT_Basic_Doctrine_Publication_10_.html'],
  ['Joint Publication 2-03, Geospatial Intelligence in Joint Operations','Joint Chiefs of Staff (EUA), 2017','Geointeligência nas operações conjuntas, com a relação de produtos e serviços padronizados. Em inglês.','https://irp.fas.org/doddir/dod/jp2_03.pdf']];
 const art=[['Do pixel ao contexto: integração doutrinária e analítica entre IMINT e GEOINT na produção de Inteligência','Revista Doutrina Militar Terrestre, v. 14, n. 45, 2026','Relação entre a Inteligência de Imagens e a Geointeligência na produção do conhecimento.','https://ebrevistas.eb.mil.br/DMT/article/view/14219/11392'],
  ['Modelos deep learning e imagens radar SAR: um estudo sobre detecção e identificação de alvos militares na Amazônia','A Lucerna, Ano XII, nº 13, 2023, p. 61','Emprego de aprendizado profundo sobre imagens de radar de abertura sintética.',''],
  ['New GEOINT fusion analysis tool could play role in ABMS, JADC2 systems','Janes, 5 de novembro de 2020','Ferramenta de fusão de dados de múltiplas fontes para analistas de Geointeligência. Em inglês.','https://www.janes.com/defence-intelligence-insights/defence-news/new-geoint-fusion-analysis-tool-could-play-role-in-abms-jadc2-systems_13437'],
  ['Detecting the Invisible: Using Foundational Context to Reveal Force Protection and Battlespace Posture','Janes, estudo técnico','Análise técnica e geoespacial combinadas para interpretar indicadores, com exemplos do conflito Rússia-Ucrânia. Em inglês.','https://www.janes.com/defence-intelligence-insights/defence-and-national-security-analysis/detecting-the-invisible-using-foundational-context-to-reveal-force-protection-and-battlespace-posture']];
 const li=L=>L.map(([t,c,x,u])=>`<div class="lib"><strong>${t}</strong><code>${c}</code><span class="muted">${x}</span>${u?`<a href="${u}" target="_blank" rel="noopener">Acessar a publicação</a>`:''}</div>`).join('');
 return `<div class="stack"><h1>Biblioteca</h1><p class="lead">Conceitos e publicações afetas à Geointeligência. Os documentos não ficam no aplicativo.</p></div>
 <section class="card"><h2>Você sabia?</h2>${Object.keys(PILLS).map(pill).join('')}</section>
 <section class="card"><h2>Manuais</h2><div>${li(man)}</div><p class="hint">Confirmar a edição vigente antes de citar.</p></section>
 <section class="card"><h2>Publicações estrangeiras</h2><div>${li(ext)}</div></section>
 <section class="card"><h2>Artigos</h2><div>${li(art)}</div></section>
 <section class="card"><h2>Créditos das imagens</h2><p class="muted just">Emblema, fundos de tela, carta com relevo, modelos tridimensionais do terreno e realces de água e de vegetação: produção do autor. Imagem de radar e realce de terreno exposto: contêm dados Copernicus Sentinel modificados; os topônimos sobre as imagens são do OpenStreetMap. Imagens de instalação, embarcação, aeronave destruída e sensor termal: obtidas em operação, não classificadas, de uso autorizado. Imagem anotada de avaliação de danos: Departamento de Defesa dos EUA. Mapa de calor de atividades físicas: © Strava 2017, Mapbox, OpenStreetMap, DigitalGlobe. As demais ilustrações são sintéticas, desenhadas para este aplicativo, e não representam áreas reais.</p></section>`;
}

/* ---------- render e eventos ---------- */
const app=document.getElementById('app');
const route=()=>['inicio','solicitante','avaliacao','teste','biblioteca'].concat(PERFIL==='analista'?['analista']:[]).includes(location.hash.slice(1))?location.hash.slice(1):'inicio';
function render(keep){
 const r=route(),act=keep&&document.activeElement?document.activeElement.id:null;
 app.innerHTML={inicio:vInicio,solicitante:vSolic,analista:vAnalista,biblioteca:vBib,avaliacao:vAval,teste:vTeste}[r]();
 document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+r?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 if(act){const e=document.getElementById(act);if(e)e.focus({preventScroll:true});}
 if(r==='inicio')drawCarta();
 drawThumbs();
}
const say=(m,id='msg')=>{const e=document.getElementById(id)||document.getElementById('msg');if(e)e.textContent=m;};
function copy(text,srcId){
 const mid=srcId==='out-par'?'msg2':'msg';
 const fb=()=>{const e=srcId&&document.getElementById(srcId);if(e){const dd=e.closest('details');if(dd)dd.open=true;e.focus();e.select();say('Cópia automática indisponível. O texto está selecionado: copiar pelo teclado.',mid);}};
 try{navigator.clipboard.writeText(text).then(()=>say('Copiado.',mid),fb);}catch(e){fb();}
}
function loadReq(txt){
 try{const o=JSON.parse(txt);if(!o||typeof o!=='object'||!('pergunta' in o))throw 0;
  const b=blank(),m={...b,...o};['A','B','C','D','E','F'].forEach(k=>{m[k]={...b[k],...(o[k]||{})};});S.an=blankAn(m);
  if(o._cod){const c={...o};delete c._cod;S.an.integ=cod(JSON.stringify(c))===o._cod?'ok':'alterado';}else S.an.integ='semcod';render();window.scrollTo(0,0);}
 catch(e){say('Conteúdo não reconhecido. Colar o arquivo da demanda completo, como gerado no módulo Solicitante.');}
}
app.addEventListener('input',e=>{const t=e.target;if((t.dataset.path||'').startsWith('req.'))S.gen=null;if(t.dataset.path&&(t.type==='text'||t.type==='date'||t.tagName==='TEXTAREA'))set(S,t.dataset.path,t.value);});
app.addEventListener('change',e=>{
 const t=e.target;if((t.dataset.path||t.dataset.arr||'').startsWith('req.'))S.gen=null;
 if(t.id==='in-file'){const f=t.files[0];if(f){const fr=new FileReader();fr.onload=()=>loadReq(String(fr.result));fr.readAsText(f);}return;}
 if(t.dataset.arr){const a=get(S,t.dataset.arr),i=a.indexOf(t.value);t.checked?(i<0&&a.push(t.value)):(i>=0&&a.splice(i,1));render(1);return;}
 if(t.dataset.bool){set(S,t.dataset.bool,t.checked);render(1);return;}
 if(t.dataset.path&&t.type==='radio'){set(S,t.dataset.path,t.value);render(1);return;}
 if(t.dataset.path&&t.tagName==='SELECT'){set(S,t.dataset.path,t.value);if(t.dataset.rr)render(1);return;}
});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='next'){S.step=Math.min(7,S.step+1);render();window.scrollTo(0,0);}
 if(a==='prev'){S.step=Math.max(0,S.step-1);render();window.scrollTo(0,0);}
 if(a==='ex'){S.req=exemplo();S.gen=null;render();}
 if(a==='clear'){S.req=blank();S.gen=null;S.step=0;render();}
 if(a==='gerar'){gerar();render();}
 if(a==='av-gerar'){const v=S.av;v.texto='AVALIAÇÃO PÓS-ENTREGA\n\nCódigo de conferência da demanda: '+(v.cod||NI)+'\nProduto recebido: '+(v.prod||NI)+'\nRespondeu à pergunta formulada: '+(SN[v.resp]||NI)+'\nChegou a tempo de apoiar a decisão: '+(SN2[v.tempo]||NI)+'\nFormato atendeu ao emprego previsto: '+(SN2[v.formato]||NI)+'\nCompreendido sem esclarecimento: '+(SN2[v.clareza]||NI)+'\n\nA aperfeiçoar:\n'+(v.faltou||NI);render();}
 if(a==='te-gerar'){const v=S.te;v.texto='FICHA DE AVALIAÇÃO DO TESTE - versão 0.9\n\nCódigo do avaliador: '+(v.aval||NI)+'\nCaso: '+(v.caso||NI)+'\nCondição: '+(PERF[v.perfil]||NI)+'\n\n1. Perguntas compreendidas sem ajuda: '+(SN[v.q1]||NI)+'\n2. Tempo de preenchimento adequado: '+(SN2[v.q2]||NI)+' ('+(v.min||'?')+' min)\n3. Resumo e alertas corresponderam ao pretendido: '+(SN[v.q3]||NI)+(v.perfil==='an'?'\n4. Ficha de demanda suficiente para iniciar: '+(SN[v.q4]||NI):'')+'\n\nA alterar, retirar ou acrescentar:\n'+(v.q5||NI);render();}
 if(a==='skin'){skin=b.dataset.k;const R=document.documentElement;if(skin)R.dataset.skin=skin;else delete R.dataset.skin;try{localStorage.setItem('geoint-skin',skin);}catch(x){}drawBg();render();}
 if(a==='exp'){const t=textoPedido(S.req,deduce(S.req))+'\n\nCódigo de conferência: '+S.gen.cod+'\nCitar este código no documento de remessa da demanda.';if(DL)Promise.resolve().then(()=>DL.save({filename:'resumo-demanda-geoint.txt',data:t})).then(()=>say('Resumo salvo.'),()=>copy(t,'out-json'));else copy(t,'out-json');}
 if(a==='copy'){copy(document.getElementById(b.dataset.src).value,b.dataset.src);}
 if(a==='save'&&DL){const v=document.getElementById(b.dataset.src).value,mid=b.dataset.src==='out-par'?'msg2':'msg';Promise.resolve().then(()=>DL.save({filename:b.dataset.name,data:v})).then(()=>say('Arquivo salvo.',mid),()=>say('O arquivo não foi salvo. Empregar o botão de copiar.',mid));}
 if(a==='to-an'){loadReq(S.gen.json);location.hash='#analista';window.scrollTo(0,0);}
 if(a==='load'){loadReq(document.getElementById('in-json').value);}
 if(a==='load-ex'){S.an=blankAn(exemplo());render();window.scrollTo(0,0);}
 if(a==='unload'){S.an=null;render();window.scrollTo(0,0);}
 if(a==='add-p'){S.an.pessoas.push({});render();}
 if(a==='del-p'){S.an.pessoas.splice(+b.dataset.i,1);render();}
 if(a==='cfg'){document.querySelectorAll('[data-cfg]').forEach(i=>{const n=parseInt(i.value,10);if(n>0)cfg[i.dataset.cfg]=n;});try{localStorage.setItem('geoint-prazos',JSON.stringify(cfg));}catch(x){}render();}
 if(a==='parecer'){
  const A=S.an,r=A.req,d=deduce(r),p=A.parecer;
  A.texto='PARECER DE VIABILIDADE'+(r.exemplo?' (EXEMPLO FICTÍCIO)':'')+'\n\nSolicitante: '+([r.nome,r.om].filter(Boolean).join(', ')||NI)+'\nPergunta: '+(r.pergunta||NI)+'\nProduto: '+d.produto
   +'\n\nResultado: '+(p.res||NI)+'\nObtenção por SARP (drone) sobre o local: '+(SN2[p.sarp]||NI)+(p.sarp==='sim'?' (prazo adicional de referência: '+cfg.sarp+' dias)':'')+'\nPrazo estimado de entrega: '+brDate(p.prazo)+'\nPrioridade sugerida: '+(d.prio?d.prio+' ('+PRIO_TXT[d.prio]+')':'indefinida')
   +'\n\nAlertas:\n'+(d.al.length?d.al.map(x=>'- '+x[1]).join('\n'):'- nenhum')+'\n\nPendências:\n'+(d.pe.length?d.pe.map(x=>'- '+x).join('\n'):'- nenhuma')
   +(p.falta?'\n\nO que falta para atender:\n'+p.falta:'')+(p.obs?'\n\nObservações:\n'+p.obs:'')+'\n\nAnalista: '+(p.analista||NI);
  render();const o=document.getElementById('out-par');if(o)o.scrollIntoView({block:'center'});
 }
});
window.addEventListener('hashchange',()=>{render();});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{drawBg();if(route()==='inicio')drawCarta();},200);});
drawBg();
render();
</script>
